[poms]
experiment = sbnd
role = production
campaign_name = CHANGE_ME
campaign_stage_name = CHANGE_ME
; test_client: leave blank for prod POMS, or set to "dev"/"int" to hit those instances
test_client =

[decision]
; placeholder thresholds for can_submit_next_slice() -- real logic supplied later
pct_complete_threshold = 80

[paths]
; poms_client.py is loaded from $POMS_CLIENT_DIR/python (set by `setup poms_client` via UPS,
; pointing at the CVMFS-installed product) -- no local path needed here.
log_file = poms_slice_cron.log
lock_file = poms_slice_cron.lock
