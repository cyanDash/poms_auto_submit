[poms]
experiment = sbnd
role = analysis
campaign_name = sdas1_prodoverlay_cosmics_hnl_mupi_m_365_Um4_1p00e7_tpc_sce_sbnd
campaign_stage_name = gen_g4_detsim_reco1_reco2_caf

[decision]
; master on/off switch; when false, the script just logs and exits without checking progress or submitting
switch = 1
; what percentage of the total number of jobs must be completed before the next slice is submitted; 0-100
pct_complete_threshold = 80
; 0: keep 1 slice in flight at a time. 1: keep 2 slices in flight at a time.
submit_two_slices = 0
; total number of slices this campaign stage needs; submission stops once last_split reaches max_splits
max_splits = 5
; counter of slices successfully submitted so far; updated by the script after each run, don't hand-edit while cron is active
last_split = 0

[paths]
log_file = poms_auto_submit.log
lock_file = poms_auto_submit.lock
