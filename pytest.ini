[pytest]
markers =
    live: makes real network/auth calls against the live POMS server (needs POMS_CLIENT_DIR + a valid token, via `source setup.sh`). Read-only. Excluded by default; run with `pytest -m live`.
addopts = -m "not live"
filterwarnings =
    ignore:invalid escape sequence:DeprecationWarning
    ignore:Using or importing the ABCs from 'collections':DeprecationWarning
